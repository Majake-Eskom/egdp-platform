engagement_tracker:

  - rule: not_null
    column: customer_id
    severity: error

  - rule: referential_integrity
    column: customer_id
    severity: error
    reference: silver.customer
    reference_column: customer_id

  - rule: not_null
    column: engagement_stage
    severity: warn

  - rule: not_null
    column: action_owner
    severity: warn

  - rule: valid_date
    column: first_engagement_date
    severity: warn

  - rule: valid_date
    column: latest_engagement_date
    severity: warn

  - rule: valid_date
    column: next_action_due_date
    severity: warn

  - rule: allowed
    column: engagement_stage
    severity: warn
    values:
      - Awaiting Engagement
      - Engaging
      - NDA & Information Sharing
      - Load Profile Analysis
      - Offer Preparation & Submission

  - rule: allowed
    column: opportunity_status
    severity: warn
    values:
      - Active
      - In Progress
      - Pending