engagement_tracker:
  - {rule: not_null, column: tracker_id,  severity: error}
  - {rule: unique,   column: tracker_id,  severity: error}
  - {rule: not_null, column: customer_id, severity: error}

  # Not in the engine yet
  - rule: referential_integrity
    column: customer_id
    severity: error
    reference: silver.customer
    reference_column: customer_id

  - {rule: not_null,   column: engagement_stage,     severity: warn}
  - {rule: not_null,   column: action_owner,         severity: warn}
  - {rule: valid_date, column: last_engagement_date, severity: warn}   # not in the engine yet
  - {rule: valid_date, column: next_action_due_date, severity: warn}   # not in the engine yet

  - rule: allowed
    column: engagement_stage
    severity: warn
    values:
      - Awaiting Engagement
      - Engaging
      - "NDA & Information Sharing"
      - Load Profile Analysis
      - "Offer Preparation & Submission"

  - rule: allowed
    column: opportunity_status
    severity: warn
    values: [Active, In Progress, Pending]